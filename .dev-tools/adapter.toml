contract = 3

[app]
name = "eucli-deep-wiki"
ports = 1

[commands]
deps   = "go -C .dev-tools/adapter run ./cmd/adapter deps"
build  = "go -C .dev-tools/adapter run ./cmd/adapter build"
start  = "go -C .dev-tools/adapter run ./cmd/adapter start"
health = "go -C .dev-tools/adapter run ./cmd/adapter health"
stop   = "go -C .dev-tools/adapter run ./cmd/adapter stop"
seed   = "go -C .dev-tools/adapter run ./cmd/adapter seed"
test   = "go -C .dev-tools/adapter run ./cmd/adapter test"

[quick-build.env]
GOCACHE = "${EUCLI_CF_QUICK_BUILD_DIR}/go-cache"
GOMODCACHE = "${EUCLI_CF_DEPS_STORE}/go/pkg/mod"
