services:
  reference-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: eucli-deep-wiki:latest
    command: ["-config", "/app/config.json"]
    ports:
      - "${EUCLI_BIND_ADDRESS:-127.0.0.1:9997}:9997"
    volumes:
      - "${EUCLI_CONFIG_FILE:?在 .env 中设置 EUCLI_CONFIG_FILE}:/app/config.json:ro"
      - "${EUCLI_DATA_DIR:?在 .env 中设置 EUCLI_DATA_DIR}:/app/data"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9997/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
