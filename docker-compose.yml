services:
  reference-sync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9997:9997"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9997/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
