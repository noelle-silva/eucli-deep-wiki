# 只描述服务端一个进程：命令行不进镜像，也不在这里出现。
services:
  eucli-deep-wiki-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: eucli-deep-wiki-server:latest
    # 启动参数由镜像的 CMD 提供（-config /app/config.json），此处不再抄一遍。
    # 需要换配置路径或追加参数时，在 docker-compose.override.yml 里用 command 覆盖。
    ports:
      - "${EUCLI_BIND_ADDRESS:-127.0.0.1:9997}:9997"
    volumes:
      - "${EUCLI_CONFIG_FILE:?在 .env 中设置 EUCLI_CONFIG_FILE}:/app/config.json:ro"
      - "${EUCLI_DATA_DIR:?在 .env 中设置 EUCLI_DATA_DIR}:/app/data"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9997/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
